name: Temporary Build Verification

on:
  push:
    branches:
      - build-verification-2026-10-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript verification
        run: npm run lint

      - name: Web production build
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install current native JARVIS bridge
        run: |
          mkdir -p android/app/src/main/java/com/jarvis/ai
          cp android-native/MainActivity.java android/app/src/main/java/com/jarvis/ai/MainActivity.java
          cp android-native/MyJarvisSpeechPlugin.java android/app/src/main/java/com/jarvis/ai/MyJarvisSpeechPlugin.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify generated Android project
        run: cd android && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-verification
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
