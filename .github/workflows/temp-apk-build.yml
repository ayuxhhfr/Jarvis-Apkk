name: JARVIS APK Build
on:
  push:
    branches:
      - apk-build-2026-10-06
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npx cap add android
      - name: Install current native bridge
        run: |
          mkdir -p android/app/src/main/java/com/jarvis/ai
          cp android-native/MainActivity.java android/app/src/main/java/com/jarvis/ai/MainActivity.java
          cp android-native/MyJarvisSpeechPlugin.java android/app/src/main/java/com/jarvis/ai/MyJarvisSpeechPlugin.java
      - run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
