name: JARVIS Android Hybrid Build

on:
  push:
    branches:
      - feature/native-kotlin-hybrid-jarvis
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Web production build
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install committed native Android sources
        run: |
          mkdir -p android/app/src/main/java/com/jarvis/ai
          cp -R android-native/. android/app/src/main/java/com/jarvis/ai/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Hybrid-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
