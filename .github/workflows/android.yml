name: JARVIS Android APK
# Manual latest-code rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: mkdir -p android/app/src/main/java/com/jarvis/ai
      - run: cp android-native/MyJarvisSpeechPlugin.java android/app/src/main/java/com/jarvis/ai/MyJarvisSpeechPlugin.java
      - run: cp android-native/MainActivity.java android/app/src/main/java/com/jarvis/ai/MainActivity.java
      - run: |
          python3 - <<'PY2'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          if "android.permission.RECORD_AUDIO" not in s:
              s=s.replace("<application", '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
          open(p,"w").write(s)
          PY2
      - run: cd android && ./gradlew assembleDebug --no-daemon --build-cache
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk